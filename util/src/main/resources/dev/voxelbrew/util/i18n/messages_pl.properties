graphics.unavailable=JavaFX 3D jest niedostępne. Sprawdź sterowniki graficzne i WSLg/Mesa. Aby użyć renderowania programowego Mesa, ustaw JAVA_OPTS='-Dprism.order=es2 -Dprism.forceGPU=true'.

# Workbench navigation and action descriptions
menu-file=_Plik
menu-edit=_Edycja
menu-view=_Widok
menu-settings=_Ustawienia
help.menu-file=Utwórz, otwórz, zapisz lub wyeksportuj projekt.
help.menu-edit=Cofnij lub ponów zmiany i zarządzaj parametrami projektu.
help.menu-view=Dopasuj model, wybierz widok standardowy lub zmień wygląd.
help.menu-settings=Wybierz język aplikacji lub sprawdź aktualizacje.
help.new=Rozpocznij pusty projekt. Najpierw możesz zapisać bieżący projekt.
help.open=Otwórz z dysku edytowalny projekt .jcad.
help.save=Zapisz bieżący projekt wraz z operacjami i parametrami.
help.save-as=Zapisz projekt pod inną nazwą lub w innym miejscu.
help.export=Wyeksportuj obliczoną geometrię do pliku. Najpierw zakończ przebudowę i wróć na koniec historii.
help.undo=Cofnij ostatnią zatwierdzoną zmianę. Cofanie osi historii jest niezależne.
help.redo=Przywróć ostatnią cofniętą zmianę.
help.parameters=Twórz nazwane wymiary, formuły i konfiguracje parametrów projektu.
help.custom-feature=Dodaj operację parametryczną dostarczoną przez zainstalowaną wtyczkę.
help.constrained-sketch=Otwórz edytor szkicu 2D, aby rysować krzywe, dodawać wiązania i określić profil.
help.rectangle=Narysuj prostokąt dwoma narożnikami, a następnie dostosuj jego wymiary.
help.circle=Narysuj okrąg, wskazując środek i promień, a następnie dostosuj jego wymiary.
help.extrude=Najpierw wybierz profil szkicu, a następnie podaj dodatnią lub ujemną odległość wyciągnięcia.
help.cut=Wybierz zamknięty profil szkicu i bryłę docelową, aby wyciąć otwór przez całą bryłę.
help.split-body=Podziel przebudowaną bryłę płaszczyzną, tworząc osobne edytowalne bryły.
help.fit=Wyśrodkuj widok i dopasuj powiększenie, aby cały model był widoczny.
help.standard-view=Ustaw kamerę w widoku standardowym bez zmieniania modelu.
help.appearance=Wybierz paletę systemową, jasną lub ciemną. To ustawienie jest zapisywane poza projektem.
help.active-configuration=Przełącz aktywny zestaw wartości parametrów i przebuduj projekt.
help.history-cursor=Cofnij model do wcześniejszej operacji. Wróć na koniec przed dodawaniem operacji lub eksportem.
help.history-feature=Wybierz tę operację, aby sprawdzić lub zmienić jej wymiary. Użyj suwaka, aby cofnąć historię.
help.unsaved-document=Ten projekt nie ma jeszcze pliku. Wybierz Plik → Zapisz, aby wskazać miejsce zapisu.
help.language=Wybierz angielski, polski lub język systemowy. Uruchom ponownie, aby zastosować wybór.
help.updates=Sprawdź nową wersję aplikacji i przejrzyj ją przed pobraniem lub instalacją.
help.apply-dimension=Zastosuj tę wartość lub formułę do wybranej operacji i przebuduj model.
help.edit-sketch-constraints=Edytuj geometrię, wymiary i wiązania wybranego szkicu.
help.custom-rebuild=Ponów obliczenie operacji po naprawieniu jej wtyczki lub danych wejściowych.
help.repair=Zastąp uszkodzone odwołanie wybranym dostępnym elementem.
help.finish-sketch=Zatwierdź szkic jako jedną operację z podanymi wymiarami.
help.commit-extrusion=Zatwierdź podgląd wyciągnięcia jako jedną zmianę w historii projektu.
help.cancel-tool=Odrzuć geometrię tymczasową bez dodawania operacji ani kroku cofania. Esc
help.constraint-finish=Zapisz wszystkie zmiany szkicu jako jedną zmianę projektu i wróć do modelu.
help.constraint-cancel=Odrzuć bieżące zmiany szkicu i wróć do modelu. Esc
help.sketch-undo=Cofnij ostatnią zmianę w bieżącym szkicu roboczym.
help.sketch-redo=Przywróć ostatnią cofniętą zmianę w bieżącym szkicu roboczym.
help.sketch-parameters=Edytuj parametry i konfiguracje używane przez szkic i projekt.
help.sketch-fit=Dopasuj całą geometrię szkicu do obszaru rysowania.
help.sketch-constraint-menu=Wybierz zależność geometryczną dla zaznaczonych elementów szkicu.
help.sketch-select-ref=Dodaj wybraną krzywą lub punkt do bieżącego zaznaczenia.
help.sketch-clear-selection=Wyczyść zaznaczone krzywe, punkty i aktywne narzędzie wiązania.
help.sketch-apply-dimension=Nadaj zaznaczonej geometrii wprowadzony wymiar lub formułę.
help.sketch-apply-constraint=Zastosuj aktywne wiązanie geometryczne do bieżącego zaznaczenia.
help.sketch-remove-constraint=Usuń wybrane wiązanie lub zwolnij unieruchomioną geometrię.
help.sketch-edit-text=Edytuj treść i styl zaznaczonego tekstu szkicu.
help.sketch-toggle-construction=Przełącz zaznaczone krzywe między geometrią konstrukcyjną a geometrią profilu.
help.sketch-use-profile=Użyj zaznaczonych zamkniętych krzywych jako profilu do późniejszych operacji 3D.
help.sketch-all-profile=Uwzględnij wszystkie krzywe niekonstrukcyjne w profilu szkicu.
help.sketch-delete-geometry=Usuń zaznaczone elementy szkicu i zależne od nich wiązania ze szkicu roboczego.
help.sketch-add-point=Dodaj podane współrzędne X i Y jako następny punkt aktywnego narzędzia.
help.sketch-complete-curve=Zakończ bieżącą krzywą splajnu, używając wprowadzonych punktów.
help.sketch-tool-select=Zaznacz krzywą lub punkt. Przytrzymaj Shift, aby rozszerzyć zaznaczenie.
help.sketch-tool-point=Wstaw punkt, klikając w szkicu lub podając współrzędne X i Y.
help.sketch-tool-line=Wskaż początek i koniec, aby narysować odcinek.
help.sketch-tool-rectangle=Wskaż dwa przeciwległe narożniki, aby narysować prostokątny profil.
help.sketch-tool-circle=Wskaż środek i punkt na obwodzie, aby narysować okrąg.
help.sketch-tool-arc=Wskaż środek, początek i koniec, aby narysować łuk przeciwnie do ruchu wskazówek zegara.
help.sketch-tool-spline=Wskaż początek, dwa punkty kontrolne i koniec, aby narysować splajn sześcienny.
help.sketch-tool-polygon=Wybierz liczbę boków, a następnie wskaż środek i promień wielokąta foremnego.
help.sketch-construction=Rysuj geometrię pomocniczą wyłączoną z profilu bryły.
help.sketch-auto=Wykrywaj wiązania geometryczne podczas rysowania nowych elementów szkicu.
help.sketch-show-badges=Pokaż lub ukryj symbole wiązań w obszarze szkicu.
help.sketch-closed-curve=Połącz koniec krzywej z początkiem, aby utworzyć zamkniętą pętlę.
help.parameter-save=Dodaj parametr lub zmień wybrany parametr w wersji roboczej. Zastosuj zatwierdza okno.
help.parameter-new=Wyczyść edytor parametrów, aby wprowadzić nowy parametr.
help.parameter-remove=Usuń parametr z wersji roboczej. Zależne wyrażenia muszą pozostać poprawne.
help.parameter-bind=Steruj wybranym wymiarem operacji za pomocą wyrażenia. Puste pole przywraca zapisaną wartość.
help.configuration-add=Utwórz konfigurację dziedziczącą domyślne wartości parametrów.
help.configuration-copy=Utwórz konfigurację z aktywnymi wartościami parametrów.
help.configuration-rename=Zmień nazwę wybranej konfiguracji w wersji roboczej.
help.configuration-remove=Usuń wybraną konfigurację z wersji roboczej.
help.configuration-activate=Użyj wybranej konfiguracji w projekcie po zatwierdzeniu tego okna.
help.configuration-set=Zastąp wartość wybranego parametru tylko w zaznaczonej konfiguracji.
help.configuration-inherit=Usuń nadpisaną wartość i użyj domyślnego wyrażenia parametru.
help.parameters-apply=Zatwierdź parametry, konfiguracje i powiązania wymiarów jako jedną zmianę.
help.parameters-cancel=Odrzuć wszystkie zmiany wprowadzone w tym oknie parametrów.
help.print-add=Dodaj wybraną bryłę modelu jako nową instancję na stole roboczym.
help.print-place=Zastosuj położenie i obrót do wybranej instancji wydruku bez zmieniania modelu CAD.
help.print-duplicate=Utwórz kolejną instancję wydruku wybranej bryły.
help.print-lay-face=Ułóż wybraną ścianę na stole roboczym.
help.print-remove=Usuń wybraną instancję wydruku ze stołu roboczego.
help.print-apply-process=Zapisz materiał, warstwy, ścianki, wypełnienie i ustawienia podpór dla projektu.
help.print-support-apply=Dodaj lub zmień nazwaną objętość podpory dla wybranej instancji.
help.print-support-remove=Usuń wybraną jawną objętość podpory.
help.print-generated-support=Eksportuj geometrię podpór, jeśli slicer ją udostępnia. Ten backend dostarcza tylko ścieżki narzędzia.
help.print-slice=Sprawdź stół roboczy i uruchom wybrany slicer, aby utworzyć plik G-code.
help.print-cancel=Zatrzymaj aktywne cięcie bez zapisywania niekompletnego wyniku.
help.print-export=Wybierz format i eksportuj geometrię modelu, bryły podpór lub ich rozmieszczenie na stole.
help.print-auto-supports=Zleć slicerowi wygenerowanie podpór tam, gdzie wymaga ich model.
help.print-bed-only=Generuj podpory automatyczne tylko tam, gdzie mogą zaczynać się na stole.
help.print-overwrite=Pozwól, aby pomyślne cięcie zastąpiło istniejący plik docelowy.
help.print-role=Pokaż lub ukryj ten rodzaj ścieżki narzędzia w podglądzie warstwy.
help.file-browse=Otwórz systemowe okno wyboru pliku lub miejsca zapisu.
help.file-confirm=Użyj podanej ścieżki, aby wykonać tę operację na pliku.
help.export-confirm=Zapisz wybraną geometrię w wybranym formacie i z podanymi opcjami.
help.export-overwrite=Pozwól, aby pomyślny eksport zastąpił istniejący plik docelowy.
help.export-option=Włącz lub wyłącz opcję eksportera: {0}.
help.custom-add=Dodaj operację wtyczki z podanymi parametrami do historii projektu.
help.custom-cancel=Zamknij bez dodawania operacji wtyczki.
help.cut-confirm=Wytnij wybrany profil przez całą bryłę docelową.
help.split-confirm=Podziel wybraną bryłę za pomocą podanej płaszczyzny.
help.unsaved-save=Zapisz bieżący projekt przed kontynuowaniem.
help.unsaved-discard=Kontynuuj bez zapisywania bieżących niezapisanych zmian.
help.unsaved-cancel=Zachowaj otwarty projekt i anuluj oczekującą czynność.
help.language-save=Zapisz wybrany język dla następnego uruchomienia aplikacji.
help.update-check=Sprawdź najnowsze wydanie lub wersję podaną powyżej.
help.update-download=Pobierz i zweryfikuj wybraną aktualizację przed instalacją.
help.update-install=Zainstaluj zweryfikowaną aktualizację i uruchom aplikację ponownie.
help.update-cancel=Zamknij okno aktualizacji i anuluj oczekującą operację aktualizacji.
help.update-force=Zezwól na instalację również wtedy, gdy wybrana wersja jest już zainstalowana.
help.dialog-apply=Zaakceptuj bieżące ustawienia i kontynuuj.
help.dialog-cancel=Anuluj okno bez zatwierdzania oczekujących zmian. Esc
help.dialog-close=Zamknij okno i wróć do obszaru roboczego.
help.dialog-no=Odrzuć ten wybór i kontynuuj.
help.view-cube-home=Wróć do widoku izometrycznego i dopasuj cały model.
help.view-cube-menu=Otwórz widoki standardowe kamery i polecenie dopasowania modelu.
help.menu-appearance=Wybierz systemową, jasną lub ciemną paletę aplikacji.
