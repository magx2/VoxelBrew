name: CAD check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: cad-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Unit tests and basic checks (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests, formatting and basic correctness checks
        run: ./gradlew spotlessCheck basicChecks test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests
          retention-days: 3
          path: |
            **/build/reports/
            **/build/test-results/test/
  integration:
    name: Integration tests
    uses: ./.github/workflows/native-check.yml
    with:
      os: ubuntu-24.04
      suite: integrationTest
      artifact-name: integration-ubuntu-24.04
  platform:
    name: Platform checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        ui-shard: [1, 2, 3, 4]
        include:
          - os: macos-15-intel
            suite: headlessPlatformCheck
            ui-shard: 1
    uses: ./.github/workflows/native-check.yml
    with:
      os: ${{ matrix.os }}
      suite: ${{ matrix.suite || (matrix.ui-shard == 1 && 'platformCheck' || ':gui:e2eTest') }}
      artifact-name: platform-${{ matrix.os }}-${{ matrix.ui-shard }}
      archive: ${{ matrix.ui-shard == 1 }}
      ui-shard: ${{ matrix.ui-shard }}
      ui-shard-count: ${{ matrix.os == 'macos-15-intel' && 1 || 4 }}
  full-check:
    name: Full check
    if: always()
    needs: [unit, integration, platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every suite and platform to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$PLATFORM_RESULT" = success
