formula.numberPrompt=Liczba lub =$width / 2
formula.numberSyntax=Liczby: wpisz 12.5 lub 2 mm. Wyrażenia działają też bez =, np. width / 2.\nZe znakiem =: =1+2/3 lub =$width/2. W wyrażeniach liczbowych znaki = i $ są opcjonalne. Używaj +, -, *, /, ^ i nawiasów oraz kropki dziesiętnej.\nWpisz $, aby wybrać nazwany parametr.
formula.textSyntax=Domyślnie tekst jest dosłowny: Szerokość: 5 pozostaje Szerokość: 5.\nZe znakiem =: ="Szerokość: " + $width oblicza parametr i łączy go z tekstem w cudzysłowie. Używaj + do łączenia wartości i nawiasów do obliczeń: ="Połowa: " + ($width/2). W tekście w cudzysłowie wpisz "", aby uzyskać znak cudzysłowu.\nWpisz $, aby wybrać nazwany parametr.
formula.help=Zacznij od =, aby wpisać formułę. Wpisz $, aby wybrać parametr; kolejne znaki filtrują nazwy według początku. Liczby wpisuj z kropką dziesiętną.
