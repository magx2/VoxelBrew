name: Release - prepare branch
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: release-mutations
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node .github/scripts/release.cjs prepare
