name: CAD check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    name: Unit tests and formatting (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests and formatting
        run: ./gradlew spotlessCheck test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests
          retention-days: 3
          path: |
            **/build/reports/
            **/build/test-results/test/
  integration:
    name: Integration tests
    uses: ./.github/workflows/native-check.yml
    with:
      os: ubuntu-24.04
      suite: integrationTest
      artifact-name: integration-ubuntu-24.04
  platform:
    name: Platform checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suite: platformCheck
          - os: windows-2022
            suite: platformCheck
          - os: macos-15-intel
            suite: headlessPlatformCheck
    uses: ./.github/workflows/native-check.yml
    with:
      os: ${{ matrix.os }}
      suite: ${{ matrix.suite }}
      artifact-name: platform-${{ matrix.os }}
      archive: true
  full-check:
    name: Full check
    if: always()
    needs: [unit, integration, platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every suite and platform to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$PLATFORM_RESULT" = success
