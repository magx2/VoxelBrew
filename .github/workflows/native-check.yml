name: Native test suite
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      suite:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
      archive:
        default: false
        type: boolean
      release-candidate:
        default: false
        type: boolean
      ui-shard:
        default: 1
        type: number
      ui-shard-count:
        default: 1
        type: number
permissions:
  contents: read
jobs:
  native:
    name: ${{ inputs.suite }} (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 75
    env:
      ORG_GRADLE_PROJECT_uiTestShard: ${{ inputs.ui-shard }}
      ORG_GRADLE_PROJECT_uiTestShardCount: ${{ inputs.ui-shard-count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        if: inputs.release-candidate
        with:
          name: release-plan
          path: .tools/release-plan
      - name: Check out the exact staged release commit
        if: inputs.release-candidate
        run: node .github/scripts/release.cjs checkout .tools/release-plan
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pinned OCCT compilation
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .tools/OCCT-7_9_0
            engine/build/native/occt
            engine/build/native/occt-install
          # Include the recipe: adding toolkits must produce a new immutable cache.
          # Reuse the previous compilation while warming the updated recipe.
          key: occt-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.os }}-${{ hashFiles('scripts/native-versions.properties') }}-${{ hashFiles('engine/build.gradle.kts', 'scripts/bootstrap-native.sh', 'scripts/bootstrap-native.ps1') }}
          restore-keys: |
            occt-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.os }}-${{ hashFiles('scripts/native-versions.properties') }}-
      - name: Reuse exact OCCT installation
        if: steps.occt-cache.outputs.cache-hit == 'true'
        shell: bash
        run: echo "ORG_GRADLE_PROJECT_reuseOcctInstall=true" >> "$GITHUB_ENV"
      - name: Bootstrap Ubuntu
        if: runner.os == 'Linux'
        run: bash scripts/bootstrap-native.sh
      - name: Bootstrap Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap-native.ps1
      - name: Bootstrap macOS (Xcode 16.4)
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          clang --version
          bash scripts/bootstrap-native.sh
          bash scripts/bootstrap-slicer-macos.sh
          echo "VOXELBREW_SLICER=$GITHUB_WORKSPACE/.tools/PrusaSlicer-2.7.2/PrusaSlicer.app/Contents/MacOS/PrusaSlicer" >> "$GITHUB_ENV"
      - name: Install pinned slicer (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          # The runner's Azure mirror can stall individual package downloads for minutes.
          # Use Ubuntu's main mirror and bound stalled requests without changing packages.
          # New runner images reference a mirror list from the deb822 source file.
          for source in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/80voxelbrew-downloads
          bash scripts/bootstrap-slicer.sh
      - name: Install pinned slicer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap-slicer.ps1
      - name: Integration tests (headless Ubuntu)
        if: inputs.suite == 'integrationTest'
        run: ./gradlew integrationTest
      - name: Platform checks (Ubuntu)
        if: (inputs.suite == 'platformCheck' || inputs.suite == 'check' || inputs.suite == ':gui:e2eTest') && runner.os == 'Linux'
        env:
          GRADLE_SUITE: ${{ inputs.suite }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth openbox libgtk-3-0t64 libgl1-mesa-dri
          bash scripts/with-virtual-desktop.sh ./gradlew "$GRADLE_SUITE"
      - name: Platform checks (Windows, v142 toolchain)
        if: (inputs.suite == 'platformCheck' || inputs.suite == 'check' || inputs.suite == ':gui:e2eTest') && runner.os == 'Windows'
        env:
          GRADLE_SUITE: ${{ inputs.suite }}
        shell: pwsh
        run: ./gradlew.bat $env:GRADLE_SUITE '-PvsGenerator=Visual Studio 17 2022'
      - name: Headless platform checks (macOS; GUI qualification deferred)
        if: (inputs.suite == 'headlessPlatformCheck' || inputs.suite == 'headlessWorkflowCheck' || inputs.suite == 'headlessPackageCheck') && runner.os == 'macOS'
        env:
          GRADLE_SUITE: ${{ inputs.suite }}
        run: ./gradlew "$GRADLE_SUITE"
      - name: Archive app images
        if: inputs.archive
        shell: bash
        run: ./gradlew ${{ inputs.release-candidate && runner.os == 'macOS' && ':cli:packageZip' || ':cli:packageZip :gui:packageZip' }} ${{ runner.os == 'Windows' && '''-PvsGenerator=Visual Studio 17 2022''' || '' }}
      - name: Install Inno Setup 6
        if: inputs.release-candidate && runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build GUI installer
        if: inputs.release-candidate && runner.os != 'Linux'
        shell: bash
        run: ./gradlew :gui:packageInstaller ${{ runner.os == 'Windows' && '''-PvsGenerator=Visual Studio 17 2022''' || '' }}
      - name: Verify installed Windows GUI and uninstall
        if: inputs.release-candidate && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-installer.ps1 (Get-Item gui/build/distributions/VoxelBrew-*-windows-x64-Setup.exe).FullName
      - name: Verify installed macOS GUI
        if: inputs.release-candidate && runner.os == 'macOS'
        run: bash scripts/check-macos-installer.sh gui/build/distributions/VoxelBrew-*-macos-x64.dmg
      - name: Collect qualified release archives and provenance
        if: inputs.release-candidate
        run: node .github/scripts/release.cjs collect .tools/release-plan .tools/release-assets
      - uses: actions/upload-artifact@v4
        if: inputs.release-candidate && success()
        with:
          name: release-assets-${{ inputs.os }}
          path: .tools/release-assets/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
      - name: Retain successful OCCT compilation after later failures
        if: ${{ always() && !cancelled() && steps.occt-cache.outputs.cache-hit != 'true' && hashFiles('engine/build/native/bridge/CMakeCache.txt') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .tools/OCCT-7_9_0
            engine/build/native/occt
            engine/build/native/occt-install
          key: ${{ steps.occt-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.artifact-name }}
          retention-days: 3
          path: |
            **/build/reports/
            **/build/test-results/
            gui/build/ui-artifacts/
            impl/exporter/build/printing-artifacts/
            cli/build/package-artifacts/
            gui/build/package-artifacts/
      - uses: actions/upload-artifact@v4
        if: inputs.archive && !inputs.release-candidate && success()
        with:
          name: app-images-${{ inputs.os }}
          retention-days: 3
          path: |
            cli/build/distributions/VoxelBrewCLI-*.zip
            gui/build/distributions/VoxelBrew-*.zip
            gui/build/distributions/VoxelBrew-*.exe
            gui/build/distributions/VoxelBrew-*.dmg
