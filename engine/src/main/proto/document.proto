syntax = "proto3";
package voxelbrew.document.v1;
option java_package = "dev.voxelbrew.engine.persistence.proto";
option java_outer_classname = "DocumentProto";

// .jcad envelope has a magic, length and SHA-256 before this message.
// Never reuse removed tags: reserve their numbers and names here.
message Document {
  uint32 schema_version = 1;
  string document_id = 2;
  Units units = 3;
  repeated Feature features = 4;
  uint32 cursor = 5;
  PrintSetup print_setup = 16;
  reserved 6 to 15;
}
enum Units {
  UNITS_UNSPECIFIED = 0;
  MILLIMETERS = 1;
}
message Plane {
  string id = 1;
  double offset_z = 2;
  reserved 3 to 7;
}
message ProfileRef {
  string sketch_id = 1;
  string profile_id = 2;
}
message BodyRef {
  string feature_id = 1;
  string output_name = 2;
}
message Rectangle {
  double x = 1;
  double y = 2;
  double width = 3;
  double height = 4;
}
message Circle {
  double center_x = 1;
  double center_y = 2;
  double diameter = 3;
}
message SketchEntity {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    POINT = 1;
    LINE = 2;
    CIRCLE = 3;
    ARC = 4;
    SPLINE = 5;
  }
  string id = 1;
  Kind kind = 2;
  repeated double values = 3;
  bool construction = 4;
}
message SketchReference {
  enum Part {
    PART_UNSPECIFIED = 0;
    OBJECT = 1;
    POINT = 2;
    START = 3;
    END = 4;
    CENTER = 5;
    CONTROL1 = 6;
    CONTROL2 = 7;
  }
  string entity_id = 1;
  Part part = 2;
}
message SketchConstraint {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    HORIZONTAL = 1;
    VERTICAL = 2;
    COINCIDENT = 3;
    TANGENT = 4;
    EQUAL = 5;
    PARALLEL = 6;
    PERPENDICULAR = 7;
    FIX = 8;
    MIDPOINT = 9;
    CONCENTRIC = 10;
    COLLINEAR = 11;
    SYMMETRY = 12;
    CURVATURE = 13;
    POLYGON = 14;
    LENGTH = 15;
    DISTANCE = 16;
    DISTANCE_X = 17;
    DISTANCE_Y = 18;
    RADIUS = 19;
    DIAMETER = 20;
    ANGLE = 21;
  }
  string id = 1;
  Type type = 2;
  repeated SketchReference refs = 3;
  repeated double values = 4;
}
message ConstrainedSketch {
  repeated SketchEntity entities = 1;
  repeated SketchConstraint constraints = 2;
  repeated string boundary = 3;
  reserved 4 to 15;
}
message Sketch {
  string profile_id = 1;
  Plane plane = 2;
  oneof profile {
    Rectangle rectangle = 3;
    Circle circle = 4;
    ConstrainedSketch constrained = 16;
  }
  reserved 5 to 15;
}
message Extrude {
  ProfileRef profile = 1;
  double distance = 2;
  reserved 3 to 7;
}
message ThroughCut {
  ProfileRef profile = 1;
  BodyRef body = 2;
  reserved 3 to 7;
}
message SplitBody {
  BodyRef body = 1;
  double normal_x = 2;
  double normal_y = 3;
  double normal_z = 4;
  double offset = 5;
}
message PrintProcess {
  double layer_height = 1;
  uint32 walls = 2;
  double infill_percent = 3;
  bool automatic_supports = 4;
  bool supports_on_bed_only = 5;
  double support_threshold = 6;
  double support_contact_gap = 7;
  uint32 interface_layers = 8;
  double brim_width = 9;
  uint32 raft_layers = 10;
}
message PrintInstance {
  string id = 1;
  string body_id = 2;
  repeated double transform = 3;
}
message SupportVolume {
  string id = 1;
  string instance_id = 2;
  enum Role {
    ROLE_UNSPECIFIED = 0;
    BLOCKER = 1;
    ENFORCER = 2;
    SOLID_SUPPORT = 3;
  }
  Role role = 3;
  double x = 4;
  double y = 5;
  double z = 6;
  double width = 7;
  double depth = 8;
  double height = 9;
}
message PrintSetup {
  string id = 1;
  uint32 version = 2;
  string backend_id = 3;
  string printer_id = 4;
  string material_id = 5;
  PrintProcess process = 6;
  repeated PrintInstance instances = 7;
  repeated SupportVolume supports = 8;
  reserved 9 to 15;
}
message CustomFeature {
  string provider_id = 1;
  string type = 2;
  uint32 payload_version = 3;
  bytes payload = 4;
  reserved 5 to 15;
}
message Feature {
  string id = 1;
  oneof definition {
    Sketch sketch = 2;
    Extrude extrude = 3;
    ThroughCut through_cut = 4;
    SplitBody split_body = 16;
    CustomFeature custom = 17;
  }
  reserved 5 to 15;
}
