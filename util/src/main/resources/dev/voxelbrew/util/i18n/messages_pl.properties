shortcuts.note=Skróty literowe i skróty widoków działają poza polami tekstowymi i listami wyboru. Podczas pisania Cofnij/Ponów działa w aktywnym polu tekstowym. Escape anuluje narzędzie lub zamyka bieżące menu/okno dialogowe; Enter zatwierdza wymiar lub kończy krzywą zaawansowanego szkicu. Nieaktywne działania pozostają niedostępne. Skróty dokumentu są zawieszone podczas edycji w oknie modalnym.
help.keyboard-shortcuts=Pokaż skróty klawiszowe dokumentu, modelowania, nawigacji i edycji szkicu.
help.workspace-design=Przejdź do obszaru Projekt, aby edytować szkice i operacje bryłowe.
help.workspace-print=Przejdź do obszaru Druk, aby przygotować rozmieszczenie, ustawienia procesu i cięcie na warstwy.

