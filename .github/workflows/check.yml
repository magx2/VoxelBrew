name: Native CAD check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bootstrap Ubuntu
        if: runner.os == 'Linux'
        run: bash scripts/bootstrap-native.sh
      - name: Bootstrap Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap-native.ps1
      - name: Full check (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgtk-3-0t64 libgl1-mesa-dri
          xvfb-run -a -s '-screen 0 1600x1000x24' env LIBGL_ALWAYS_SOFTWARE=1 ./gradlew check
      - name: Full check (Windows, v142 toolchain)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./gradlew.bat check '-PvsGenerator=Visual Studio 17 2022'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ matrix.os }}
          path: |
            **/build/reports/
            **/build/test-results/
            gui/build/ui-artifacts/
