constraint.hint.HORIZONTAL=Wybierz linię lub dwa punkty.
constraint.hint.VERTICAL=Wybierz linię lub dwa punkty.
constraint.hint.COINCIDENT=Wybierz dwa punkty lub punkt i linię, okrąg, łuk albo splajn.
constraint.hint.TANGENT=Wybierz linię i okrąg, dwa okręgi lub dwa końce krzywych.
constraint.hint.EQUAL=Wybierz dwie linie, dwa okręgi lub łuki albo dwie elipsy.
constraint.hint.PARALLEL=Wybierz dwie linie.
constraint.hint.PERPENDICULAR=Wybierz dwie linie.
constraint.hint.COLLINEAR=Wybierz dwie linie.
constraint.hint.FIX=Wybierz element lub punkt. Wybierz jego wiązanie unieruchomienia, aby je usunąć.
constraint.hint.MIDPOINT=Wybierz punkt, a następnie linię lub łuk.
constraint.hint.CONCENTRIC=Wybierz dwa okręgi, łuki lub elipsy.
constraint.hint.SYMMETRY=Wybierz dwa punkty lub elementy, a następnie linię osi symetrii.
constraint.hint.CURVATURE=Wybierz dwa końce krzywych; co najmniej jedna musi być splajnem.
constraint.hint.POLYGON=Wybierz co najmniej trzy połączone linie w kolejności obwodu.
constraint.hint.LENGTH=Wybierz jedną linię.
constraint.hint.DISTANCE=Wybierz dwa punkty (można wybrać początek układu).
constraint.hint.DISTANCE_X=Wybierz dwa punkty (można wybrać początek układu).
constraint.hint.DISTANCE_Y=Wybierz dwa punkty (można wybrać początek układu).
constraint.hint.RADIUS=Wybierz okrąg lub łuk.
constraint.hint.DIAMETER=Wybierz okrąg lub łuk.
constraint.hint.ANGLE=Wybierz jedną linię (względem osi X) lub dwie linie. Wpisz kąt w stopniach.
constraint.hint.MAJOR_RADIUS=Wybierz elipsę.
constraint.hint.MINOR_RADIUS=Wybierz elipsę.
constraint.hint.RHO=Wybierz krzywą stożkową; wpisz współczynnik od 0 do 1.
constraint.hint.TEXT_HEIGHT=Wybierz element tekstowy.
constraint.hint.TEXT_SPACING=Wybierz element tekstowy.
tool.hint.RECTANGLE_TWO_POINT=Kliknij dwa przeciwległe narożniki.
tool.hint.RECTANGLE_THREE_POINT=Kliknij dwa narożniki pierwszej krawędzi, a następnie przeciwległą krawędź.
tool.hint.RECTANGLE_CENTER=Kliknij środek, a następnie narożnik.
tool.hint.CIRCLE_CENTER=Kliknij środek, a następnie punkt na obwodzie.
tool.hint.CIRCLE_TWO_POINT=Kliknij przeciwległe końce średnicy.
tool.hint.CIRCLE_THREE_POINT=Kliknij trzy punkty na obwodzie.
tool.hint.CIRCLE_TWO_TANGENT=Wybierz dwie linie, ustaw promień i kliknij w pobliżu żądanego środka okręgu.
tool.hint.CIRCLE_THREE_TANGENT=Wybierz trzy linie i kliknij w pobliżu żądanego środka okręgu.
tool.hint.ARC_CENTER=Kliknij środek, początek i koniec (przeciwnie do ruchu wskazówek zegara).
tool.hint.ARC_THREE_POINT=Kliknij początek, koniec i punkt na łuku.
tool.hint.ARC_TANGENT=Wybierz koniec krzywej, a następnie kliknij koniec nowego łuku.
tool.hint.POLYGON_INSCRIBED=Ustaw liczbę boków; kliknij środek i wierzchołek.
tool.hint.POLYGON_CIRCUMSCRIBED=Ustaw liczbę boków; kliknij środek i punkt środkowy krawędzi.
tool.hint.POLYGON_EDGE=Ustaw liczbę boków; kliknij dwa końce krawędzi i stronę zawierającą wielokąt.
tool.hint.ELLIPSE=Kliknij środek, koniec pierwszej osi i punkt na drugiej osi.
tool.hint.SLOT_CENTER_TO_CENTER=Kliknij środki obu zakończeń, a następnie punkt na boku fasolki.
tool.hint.SLOT_OVERALL=Kliknij oba skrajne końce, a następnie punkt określający połowę szerokości.
tool.hint.SLOT_CENTER_POINT=Kliknij środek fasolki, środek zakończenia i punkt określający połowę szerokości.
tool.hint.SLOT_ARC_THREE_POINT=Kliknij początek i koniec osi łukowej, punkt na jej łuku i punkt określający szerokość.
tool.hint.SLOT_ARC_CENTER=Kliknij środek, początek i koniec osi łukowej, a następnie punkt określający szerokość.
tool.hint.FIT_SPLINE=Rozmieść punkty, a następnie wybierz Zakończ krzywą lub naciśnij Enter. Zamknięcie łączy krzywą z jej początkiem.
tool.hint.CONTROL_SPLINE=Rozmieść punkty, a następnie wybierz Zakończ krzywą lub naciśnij Enter. Zamknięcie łączy krzywą z jej początkiem.
tool.hint.CONIC=Ustaw rho (0–1); kliknij początek, koniec i wierzchołek przecięcia stycznych.
tool.hint.TEXT=Wpisz tekst i wysokość, a następnie kliknij punkt zakotwiczenia linii bazowej.
tool.hint.TEXT_ON_PATH=Wybierz krzywą ścieżki, wpisz tekst i wysokość, a następnie kliknij w pobliżu początku tekstu na ścieżce.
