help.menu-file=Create, open, save or export a design.
help.menu-edit=Undo or redo edits and manage design parameters.
help.menu-view=Fit the model, choose a standard view or change the appearance.
help.menu-settings=Choose the application language or check for updates.
help.new=Start an empty design. You can save the current design first.
help.open=Open an editable .jcad design from disk.
help.save=Save the current design, including its features and parameters.
help.save-as=Save the design under a different name or location.
help.export=Export evaluated geometry to a file. Finish rebuilding and return to the end of the timeline first.
help.undo=Undo the last committed edit. Timeline rollback is independent.
