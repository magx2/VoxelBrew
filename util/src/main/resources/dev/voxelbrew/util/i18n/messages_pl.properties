help.slicer.title=Pomoc slicera
help.designer.title=Pomoc projektanta
help.slicer.content=Dodaj bryłę CAD na karcie Rozmieszczenie, następnie wybierz instancję, aby ją przesunąć, obrócić lub powielić.\nNad stołem wybierz widok 2D lub izometryczny 3D. Kliknij dwukrotnie wymiary stołu, aby zmienić obszar roboczy.\nProces określa materiał, warstwy, obrysy i wypełnienie. Podpory pozwalają dodawać blokady, wymuszenia i pełne podpory przypisane do instancji.\nNa karcie Zadanie uruchom slicer. Plik G-code domyślnie ma nazwę i folder projektu. Suwak warstw i filtry służą do przeglądania ścieżek.\nCtrl+1 wraca do projektanta; Ctrl+S zapisuje projekt.
help.designer.content=Utwórz szkic, narysuj i zwymiaruj geometrię, zakończ szkic i wykonaj wyciągnięcie. Wybierz bryłę lub ścianę, aby użyć narzędzi modelowania.\nOś historii pozwala przeglądać i edytować operacje. Nazwy brył zmienisz w drzewie modelu.\nCtrl+S zapisuje, Ctrl+Z cofa, Ctrl+Y ponawia. Ctrl+2 otwiera slicer po zapisaniu projektu.\nPełną listę skrótów znajdziesz w menu pomocy.
help.context-help=Pokaż pomoc dla bieżącego obszaru roboczego.
